# =====================================================================
#  eZielnik – baza + API + strona + rozpoznawanie zdjęć (ml)
#
#  Serwer (Coolify): zasób "Docker Compose" z tego repozytorium, plik /docker-compose.yml
#  Lokalnie:        docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
#
# =====================================================================

services:

  # ---------- baza danych (niedostępna z internetu) ----------
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-herb-recognition-db}
      POSTGRES_USER: ${POSTGRES_USER:-herb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ustaw POSTGRES_PASSWORD}
    volumes:
      # od PostgreSQL 18 wolumen montuje się w /var/lib/postgresql (nie .../data)
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------- API (tylko w sieci wewnętrznej, bez domeny) ----------
  api:
    build:
      context: ./HerbRecognition_APIs
      dockerfile: Dockerfile
      args:
        DOTNET_VERSION: "9.0"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB:-herb-recognition-db};Username=${POSTGRES_USER:-herb};Password=${POSTGRES_PASSWORD}"
      AdminAuth__Username: ${ADMIN_USERNAME:?Ustaw ADMIN_USERNAME}
      AdminAuth__Password: ${ADMIN_PASSWORD:?Ustaw ADMIN_PASSWORD}
      Jwt__Key: ${JWT_KEY:?Ustaw JWT_KEY (min. 32 znaki)}
      Cors__AllowedOrigins__0: ${PUBLIC_URL:-http://localhost:8080}
      PictureStorage__RootPath: /app/data/pictures
      Recognition__MlBaseUrl: http://ml:8000/   # rozpoznawanie ze zdjęcia (serwis ml niżej)
    volumes:
      - pictures:/app/data/pictures

  # ---------- rozpoznawanie roślin ze zdjęcia (tylko sieć wewnętrzna) ----------
  #  BioCLIP (MIT) + PlantCLEF 2024 od Pl@ntNet (CC BY 4.0), działa na procesorze.
  #  Pierwszy start pobiera modele (~3 GB) do wolumenu ml-models – trwa kilkanaście minut,
  #  w tym czasie strona pokazuje "modele się uruchamiają". Kolejne starty: ok. 1 minuty.
  ml:
    build:
      context: ./HerbRecognition_ML
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      BIOCLIP_MODEL: ${BIOCLIP_MODEL:-hf-hub:imageomics/bioclip}
      PLANTCLEF_ENABLED: ${PLANTCLEF_ENABLED:-true}
      PLANTCLEF_IMG_SIZE: ${PLANTCLEF_IMG_SIZE:-518}
      TORCH_THREADS: "2"
    volumes:
      - ml-models:/models
    # serwer ma 3,7 GB RAM – limit chroni bazę i API, gdyby modele zajęły za dużo
    mem_limit: 2200m

  # ---------- strona (jedyny element widoczny z internetu) ----------
  web:
    build:
      context: ./HerbRecognition_Web
      dockerfile: Dockerfile
      args:
        DOTNET_VERSION: "9.0"
    restart: unless-stopped
    depends_on:
      - api
    environment:
      ApiBaseUrl: http://api:8080/             # adres API w sieci wewnętrznej Dockera
      AllowedHosts: ${ALLOWED_HOSTS:-*}
      DataProtection__KeysPath: /data/keys
    volumes:
      - web-keys:/data/keys

volumes:
  db-data:
  pictures:
  web-keys:
  ml-models:
